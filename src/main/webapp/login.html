<!DOCTYPE html>
<html>
<head>
    <title>Login - Genz Toysss</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding-top: 50px;
        }

        .login-box {
            width: 350px;
            background: white;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: purple;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: purple;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #5a189a;
        }

        a {
            color: purple;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>Login</h1>

    <form action="LoginServlet" method="post">

        <input type="email" 
               name="email" 
               placeholder="Enter Email"
               required>

        <br>

        <input type="password" 
               name="password" 
               placeholder="Enter Password"
               required>

        <br>

        <button type="submit">Login</button>

    </form>

    <br>

    <p>
        New user?
        <a href="register.html">Register</a>
    </p>

</div>

</body>
</html>
