<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login - Genz Toysss</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#7b2cbf,#c77dff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    width:380px;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

h1{
    color:#7b2cbf;
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:95%;
    padding:12px;
    background:#7b2cbf;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#5a189a;
}

</style>

</head>

<body>

<div class="login-box">

<h1>🧸 Admin Login</h1>

<form action="AdminLoginServlet" method="post">

<input type="email"
name="email"
placeholder="Enter Admin Email"
required>

<input type="password"
name="password"
placeholder="Enter Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
