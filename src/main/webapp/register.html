<!DOCTYPE html>
<html>
<head>
    <title>Register - Genz Toysss</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            text-align:center;
            padding:50px;
        }

        .box{
            background:white;
            width:350px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h1{
            color:purple;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
            border-radius:5px;
            border:1px solid #ccc;
        }

        button{
            background:purple;
            color:white;
            padding:12px 25px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        a{
            color:purple;
        }

    </style>

</head>

<body>

<div class="box">

<h1>Register</h1>

<form action="RegisterServlet" method="post">

<input type="text" name="name" placeholder="Enter Name" required>
<br>

<input type="email" name="email" placeholder="Enter Email" required>
<br>

<input type="password" name="password" placeholder="Enter Password" required>
<br>

<button type="submit">Register</button>

</form>

<br>

<a href="login.html">Already have an account? Login</a>

</div>

</body>
</html>
